# nginx site config for webnovells.ru (PR 195) - the single point of entry on 80/443,
# reverse-proxying everything to the app container on 127.0.0.1:8000 (see
# docker-compose.yml, which no longer publishes 8000 on all interfaces once this is in
# place).
#
# This is the *pre-TLS* bootstrap version, deliberately HTTP-only: `certbot --nginx -d
# webnovells.ru --redirect` (see DEPLOY.md, PR 196) needs `nginx -t`/reload to succeed
# with this file *before* any certificate exists, so it can't reference
# ssl_certificate/ssl_certificate_key paths that don't exist yet. Once run, certbot's
# nginx plugin edits the deployed copy in /etc/nginx/sites-available/ in place - adding
# the 443 server block (reusing this file's own proxy/timeout/size settings below,
# unchanged), the https redirect on 80, and the ACME-challenge renewal handling - without
# any further action here. That server-local edit is expected to diverge from this
# tracked copy; it's not meant to be copied back.
server {
    listen 80;
    listen [::]:80;
    server_name webnovells.ru;

    # PR 150's comment video attachments allow up to MAX_VIDEO_SIZE_BYTES (50 MB,
    # app/comment_attachment.py) - nginx's own default (1 MB) would reject the upload
    # with a 413 before it ever reaches the app. Some headroom above 50 MB for
    # multipart/form-data framing overhead.
    client_max_body_size 60m;

    # Above the default 60s - a synchronous single-chapter/volume export (see TASK.md,
    # "для отдельной главы/тома синхронная отдача приемлема") waits on ranobelib.me and
    # shouldn't get cut off by the proxy before the app's own request actually finishes.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
