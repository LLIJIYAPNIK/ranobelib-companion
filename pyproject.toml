[project]
name = "ranobelib-companion"
version = "0.1.0"
description = "Web UI for reading and downloading ranobe, built on top of ranobelib-python-sdk"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "ranobelib-python-sdk>=0.3.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
