{% extends "base.html" %}
{% block title %}Все тайтлы — RanobeLib Companion{% endblock %}
{% block content %}
{% include "_library_tabs.html" %}
<main class="content">
  <div class="catalog-grid" data-role="catalog-grid" data-next-page="{{ page + 1 if has_next_page else '' }}">
    {% include "_catalog_cards.html" %}
  </div>
  <div class="catalog-grid__sentinel" data-role="catalog-sentinel" aria-hidden="true"></div>
  <noscript>
    {% if has_next_page %}
    <p class="content__hint"><a href="?page={{ page + 1 }}">Следующая страница</a></p>
    {% endif %}
  </noscript>
  <script src="{{ url_for('static', path='js/catalog-scroll.js') }}" defer></script>
</main>
{% endblock %}
