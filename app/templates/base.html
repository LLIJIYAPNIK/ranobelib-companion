<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RanobeLib Companion{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar__brand" aria-hidden="true"></div>
      <a class="sidebar__link{% if active_nav == 'home' %} sidebar__link--active{% endif %}" href="/">Главная</a>
      <a class="sidebar__link{% if active_nav == 'library' %} sidebar__link--active{% endif %}" href="/library">Библиотека</a>
      <span class="sidebar__link sidebar__link--disabled" title="Скоро">Загрузки</span>
      <span class="sidebar__link sidebar__link--disabled" title="Скоро">Активность</span>
      <div class="sidebar__account">
        {% if current_user %}
        <span class="sidebar__account-email" title="{{ current_user.email }}">{{ current_user.email }}</span>
        <form method="post" action="/logout">
          <button class="sidebar__link sidebar__account-logout" type="submit">Выйти</button>
        </form>
        {% else %}
        <a class="sidebar__link" href="/login">Войти</a>
        <a class="sidebar__link" href="/register">Регистрация</a>
        {% endif %}
      </div>
    </nav>
    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
