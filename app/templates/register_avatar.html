{% extends "base.html" %}
{% block title %}Добавить аватар — RanobeLib Companion{% endblock %}
{% block content %}
<header class="header">
  <h1 class="toc__title">Хотите добавить аватар?</h1>
</header>
<main class="content">
  <p class="content__hint">
    Необязательно — можно сделать это позже в настройках аккаунта.
  </p>
  {% if avatar_error %}
  <p class="form-error">{{ avatar_error }}</p>
  {% endif %}
  <form
    class="settings-form settings-form--avatar"
    method="post"
    action="/register/avatar"
    enctype="multipart/form-data"
    data-role="avatar-upload-form"
  >
    <label class="avatar-upload" aria-label="Загрузить аватар" data-role="avatar-upload-trigger">
      <span class="avatar-upload__preview" data-role="avatar-upload-preview">
        {% if avatar_url(current_user) %}
        <img class="avatar-img" src="{{ avatar_url(current_user) }}" alt="">
        {% else %}
        <span class="avatar-upload__initials">{{ avatar_initials(current_user) }}</span>
        {% endif %}
      </span>
      <span class="avatar-upload__overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </span>
      <input
        class="avatar-upload__input"
        id="register-avatar"
        type="file"
        name="avatar"
        accept="image/png,image/jpeg,image/webp"
        data-role="avatar-upload-input"
        required
      >
    </label>
  </form>
  <p class="content__hint content__hint--auth"><a href="/">Пропустить</a></p>
</main>
<script src="{{ url_for('static', path='js/avatar-upload.js') }}" defer></script>
{% endblock %}
