{% extends "admin/_layout.html" %}
{% block title %}Вход{% endblock %}
{% block login %}
<main class="wn-admin__center">
  <section class="wn-admin__card" aria-labelledby="admin-login-title">
    <h1 class="wn-admin__title" id="admin-login-title">Админ-панель</h1>
    <p class="wn-admin__hint">Отдельный вход, не связанный с аккаунтами сайта.</p>
    {% if error %}
    <p class="ui-notice ui-notice--error" role="alert">{{ error }}</p>
    {% endif %}
    <form class="wn-admin__form" method="post" action="/admin/login" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <div class="ui-field">
        <label class="ui-field__label" for="admin-password">Пароль</label>
        <input class="ui-input" id="admin-password" type="password" name="password" required autofocus autocomplete="current-password">
      </div>
      <button class="ui-btn ui-btn--primary" type="submit">Войти</button>
    </form>
  </section>
</main>
{% endblock %}
