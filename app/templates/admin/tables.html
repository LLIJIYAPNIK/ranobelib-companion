{% extends "admin/_layout.html" %}
{% block title %}Таблицы{% endblock %}
{% block content %}
<main class="wn-admin__main" aria-labelledby="admin-tables-title">
  <h1 class="wn-admin__title" id="admin-tables-title">Таблицы</h1>
  <p class="wn-admin__hint">Только просмотр. Хеши паролей, токены и коды скрыты.</p>
  <div class="wn-admin__scroll">
    <table class="wn-admin__table">
      <thead><tr><th>Таблица</th><th class="wn-admin__num">Строк</th><th class="wn-admin__num">Колонок</th></tr></thead>
      <tbody>
        {% for table in tables %}
        <tr>
          <td><a href="/admin/tables/{{ table.name }}">{{ table.name }}</a></td>
          <td class="wn-admin__num">{{ table.rows }}</td>
          <td class="wn-admin__num">{{ table.columns }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</main>
{% endblock %}
