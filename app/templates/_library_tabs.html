{# "Читаю" / "Все тайтлы" on the Aurora Ink tabs component (PR 251/252).
   library-tabs-swipe.js reads .library-tabs__link and its --active modifier. #}
<nav class="ui-tabs" aria-label="Библиотека">
  <a class="ui-tabs__link library-tabs__link{% if active_tab == 'reading' %} library-tabs__link--active{% endif %}" href="/library"{% if active_tab == 'reading' %} aria-current="page"{% endif %}>Читаю</a>
  <a class="ui-tabs__link library-tabs__link{% if active_tab == 'catalog' %} library-tabs__link--active{% endif %}" href="/library/catalog"{% if active_tab == 'catalog' %} aria-current="page"{% endif %}>Все тайтлы</a>
</nav>
