{% for title in items %}
{% set cover_url = title.cover.default or title.cover.md or title.cover.thumbnail %}
<a class="catalog-card" href="/titles/{{ title.slug_url }}">
  {% if cover_url %}
  <img class="catalog-card__cover" src="{{ cover_url }}" alt="Обложка «{{ title.name }}»" loading="lazy">
  {% endif %}
  <span class="catalog-card__name">{{ title.name }}</span>
  {% if title.status %}
  <span class="badge catalog-card__status">{{ title.status.label }}</span>
  {% endif %}
</a>
{% endfor %}
