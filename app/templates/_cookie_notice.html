<div class="cookie-notice" data-role="cookie-notice">
  <p class="cookie-notice__text">Сайт использует cookie для входа и истории просмотров.</p>
  <button class="btn btn--sm cookie-notice__dismiss" type="button" data-role="cookie-notice-dismiss">Понятно</button>
</div>
<script>
  // Same synchronous-inline-before-first-paint trick as the sidebarExpanded script
  // above, so a visitor who already dismissed the banner never sees it flash in.
  if (localStorage.getItem("cookieNoticeDismissed") === "1") {
    document.querySelector('[data-role="cookie-notice"]').hidden = true;
  }
</script>
