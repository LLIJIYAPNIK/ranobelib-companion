{% extends "base.html" %}
{% block head_extra %}
<!-- PR 121: opts only the /settings/* pages into cross-document View Transitions - this
     is a server-rendered MPA (full page loads between /settings/account, /settings/security,
     /settings/reading), so without this the sidebar's active-link highlight and the whole
     page repaint in one abrupt frame on every switch. @view-transition is a document-level
     at-rule with no selector scoping, so it can't be added once to app.css and limited to
     these routes from CSS alone - it's declared per-template instead, only where
     settings_layout.html (shared by all three sub-pages) is the base. Unsupported browsers
     (anything non-Chromium today) just ignore the unknown at-rule and keep today's plain,
     instant navigation - no worse than before this PR. -->
<style>
  @view-transition {
    navigation: auto;
  }
</style>
{% endblock %}
{% block content %}
<main class="content">
  <h1 class="toc__title">Настройки</h1>
  <div class="settings-layout" data-role="settings-layout">
    <nav class="settings-nav" data-role="settings-nav" aria-label="Разделы настроек">
      <a
        class="settings-nav__link{% if active_settings_section == 'account' %} settings-nav__link--active{% endif %}"
        href="/settings/account"
      >Аккаунт</a>
      <a
        class="settings-nav__link{% if active_settings_section == 'security' %} settings-nav__link--active{% endif %}"
        href="/settings/security"
      >Безопасность</a>
      <a
        class="settings-nav__link{% if active_settings_section == 'reading' %} settings-nav__link--active{% endif %}"
        href="/settings/reading"
      >Чтение</a>
    </nav>
    <div class="settings-content">
      <a class="settings-back" data-role="settings-back" href="/settings" hidden>← Разделы</a>
      {% block settings_content %}{% endblock %}
    </div>
  </div>
</main>
{% block settings_scripts %}{% endblock %}
<script src="{{ url_for('static', path='js/settings-mobile-nav.js') }}" defer></script>
{% endblock %}
