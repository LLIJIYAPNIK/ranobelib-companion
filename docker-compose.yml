services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/lliyapnik/ranobelib-companion:latest
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # PR 195: nginx (127.0.0.1:80/443 on the host) is the only intended public entry
      # point once deployed - binding this to loopback only, rather than all interfaces,
      # closes the direct unauthenticated/TLS-less bypass of it.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cache_data:/app/.ranobelib_cache
      - avatar_data:/app/.ranobelib_avatars
      - comment_attachment_data:/app/.ranobelib_comment_attachments

volumes:
  db_data:
  cache_data:
  avatar_data:
  comment_attachment_data:
